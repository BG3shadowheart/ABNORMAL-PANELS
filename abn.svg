<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c31"/>
      <stop offset="1" stop-color="#172943"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28d7ff"/>
      <stop offset="1" stop-color="#6685ff"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="2" y="2" width="596" height="116" rx="22"/>
    </clipPath>
  </defs>

  <style>
    .glow {
      animation: glow 2.8s ease-in-out infinite;
    }
    .shine {
      animation: shine 3.8s ease-in-out infinite;
    }
    .arrow {
      animation: drop 1.8s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { opacity: .65; }
      50% { opacity: 1; }
    }
    @keyframes shine {
      0%, 25% { transform: translateX(-220px); }
      70%, 100% { transform: translateX(700px); }
    }
    @keyframes drop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }
  </style>

  <rect x="2" y="2" width="596" height="116" rx="22" fill="url(#bg)" stroke="#304461" stroke-width="2"/>
  <rect x="3" y="3" width="594" height="3" rx="2" fill="url(#blue)" class="glow"/>

  <g clip-path="url(#clip)">
    <rect class="shine" x="-180" y="0" width="180" height="120" fill="url(#glint)" transform="skewX(-22)"/>
  </g>

  <circle cx="82" cy="60" r="32" fill="#0b1423" stroke="#304461" stroke-width="2"/>
  <circle cx="82" cy="60" r="25" fill="none" stroke="url(#blue)" stroke-width="2" opacity=".8"/>
  <g class="arrow" fill="none" stroke="url(#blue)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82 41v25"/>
    <path d="m72 57 10 10 10-10"/>
    <path d="M68 76v4h28v-4"/>
  </g>

  <text x="132" y="51" fill="#90a3bf" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">LATEST RELEASE</text>
  <text x="132" y="81" fill="#f5f8ff" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="1">DOWNLOAD</text>

  <rect x="430" y="42" width="132" height="36" rx="18" fill="#1c3150" stroke="#3c5d87"/>
  <text x="496" y="65" fill="#c8dcff" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">GET THE LATEST</text>
</svg>
``
